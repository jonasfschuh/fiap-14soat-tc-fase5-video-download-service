spring:
  application:
    name: video-download-service

server:
  port: ${SERVER_PORT:8085}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  storage:
    type: ${APP_STORAGE_TYPE:local}
    local:
      processed-path: ${STORAGE_OUTPUT_PATH:/app/videos/processed}
  presign:
    ttl-minutes: ${PRESIGN_TTL_MINUTES:15}
    secret: ${PRESIGN_SECRET:local-dev-insecure-secret-change-me}
  download:
    public-path-prefix: ${DOWNLOAD_PUBLIC_PATH_PREFIX:}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8090}

swagger:
  server:
    url: ${SWAGGER_SERVER_URL:/}

logging:
  level:
    br.com.fiap: INFO
    org.springframework: WARN

---
spring:
  config:
    activate:
      on-profile: test

app:
  storage:
    type: local-test

---
spring:
  config:
    activate:
      on-profile: docker

app:
  storage:
    type: local

---
spring:
  config:
    activate:
      on-profile: k8s

# O ingress reescreve /download(/|$)(.*) -> /$2, entao o app recebe as
# requisicoes sem o prefixo /download. O Swagger UI roda no browser e
# precisa dos paths completos (com prefixo) para que o ingress roteie
# corretamente as chamadas de api-docs/config feitas pelo JS da pagina.
# Pelo mesmo motivo, a URL de download presignada (que tambem e aberta
# diretamente pelo navegador/curl do usuario, fora do cluster) precisa
# ser montada com o prefixo /download.
app:
  download:
    public-path-prefix: /download

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    config-url: /download/v3/api-docs/swagger-config
    url: /download/v3/api-docs
